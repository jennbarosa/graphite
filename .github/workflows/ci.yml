name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bootstrap converter is built from an older commit, so the history is needed.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the TypeScript compiler
        run: npm install --global typescript@6.0.3
      # build.rs needs the converter; see CONTRIBUTING.md (Bootstrap). 2bcd4ff^ predates the
      # self-hosted parser, so the converter there builds against the public API.
      - name: Build the bootstrap converter
        run: |
          git worktree add --detach "$RUNNER_TEMP/bootstrap-src" 2bcd4ff^
          cp examples/bootstrap_dump.rs "$RUNNER_TEMP/bootstrap-src/examples/"
          cargo build --manifest-path "$RUNNER_TEMP/bootstrap-src/Cargo.toml" --locked \
            --example bootstrap_dump --target-dir "$RUNNER_TEMP/bootstrap-target"
          echo "GRAPHITE_BOOTSTRAP=$RUNNER_TEMP/bootstrap-target/debug/examples/bootstrap_dump" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features
