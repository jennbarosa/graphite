name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bun, purs, spago and tsc at the versions the tests pin (see scripts/setup-tools.sh).
      - name: Install the test tools
        run: scripts/setup-tools.sh
      # src/generated/ must match what the converter writes from the .graphite rule files.
      - name: Check the generated rule data is current
        run: |
          for rule in lex grammar structure build directive; do
            cargo run --quiet --example bootstrap_dump -- "src/graphs/$rule.graphite" "src/generated/$rule.rs"
          done
          git diff --exit-code -- src/generated
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features
